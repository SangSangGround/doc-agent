<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc">
<title id="title">Doc Agent iPhone 앱과 개발용 PC 서버 아키텍처</title>
<desc id="desc">SwiftUI 아이폰 앱에서 촬영한 문서를 같은 Wi-Fi의 Python HTTPS 서버로 보낸다. 서버는 OpenCV로 촬영 품질과 체크 표시를 확인하고 검토된 양식 원문과 선택 대조 결과를 반환한다. 아이폰은 iOS TTS로 읽는다. Tesseract OCR은 PC에서 마스킹 후보를 만든다. 기존 RF-DETR 분석 도구는 양식 준비를 위한 별도 경로다. 앱 전체 빌드와 실기기 검증은 대기 중이다.</desc>
