<text x="1604" y="896" font-size="23" font-weight="400" fill="#0968CF" text-anchor="end">OpenCV</text>
<text x="851" y="943" font-size="26" font-weight="400" fill="#526174" text-anchor="start">등록된 칸 위치 안내 · 선택과 실제 체크 표시 비교</text>
