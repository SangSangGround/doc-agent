<text x="1218" y="1301" font-size="26" font-weight="400" fill="#526174" text-anchor="start">부적합 사진 통과율 · 핵심 정보 정확도 · 근거 없는 답변</text>
<text x="1218" y="1344" font-size="25" font-weight="400" fill="#526174" text-anchor="start">과제 완료 시간 · 재촬영 횟수</text>
<text x="100" y="1441" font-size="23" font-weight="400" fill="#526174" text-anchor="start">외부 LLM을 사용하는 경우 가상 문서의 질문과 필요한 근거 문장만 전달</text>
