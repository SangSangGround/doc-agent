<text x="851" y="803" font-size="25" font-weight="400" fill="#526174" text-anchor="start">현재 문서에서 근거 문장 조회 · 답변 확인</text>
<text x="851" y="832" font-size="24" font-weight="400" fill="#526174" text-anchor="start">읽기 어려운 항목은 재촬영 요청</text>
<rect x="827" y="856" width="801" height="119" rx="14" fill="#F2F5F8"/>
