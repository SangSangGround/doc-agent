<text x="851" y="672" font-size="25" font-weight="400" fill="#526174" text-anchor="start">잘림·흐림 검사 → 원근 보정·양식 확인</text>
<text x="851" y="701" font-size="24" font-weight="400" fill="#526174" text-anchor="start">반사로 가린 칸 표시 · 금액과 날짜 판독</text>
