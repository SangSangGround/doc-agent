<text x="160" y="540" font-size="31" font-weight="700" fill="#172231" text-anchor="start">촬영 안내·자동 촬영</text>
<text x="160" y="581" font-size="25" font-weight="400" fill="#526174" text-anchor="start">비프음·음성으로 위치 안내</text>
<text x="160" y="615" font-size="25" font-weight="400" fill="#526174" text-anchor="start">안정된 상태에서 자동 촬영</text>
