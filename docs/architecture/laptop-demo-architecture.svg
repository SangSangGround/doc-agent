<text x="160" y="701" font-size="31" font-weight="700" fill="#172231" text-anchor="start">음성 질문·원문 듣기</text>
<text x="160" y="742" font-size="25" font-weight="400" fill="#526174" text-anchor="start">마이크 또는 키보드로 질문</text>
