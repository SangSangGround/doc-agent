<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img" aria-labelledby="title description">
<title id="title">노트북 문서 도우미 아키텍처</title>
<desc id="description">노트북 한 대에서 브라우저로 문서를 맞추고 자동 촬영한다. 로컬 Python 서버가 사진 품질을 검사하고 양식을 확인한 뒤 금액과 날짜를 읽는다. 질문에는 현재 문서의 원문을 근거로 답하며, 반사로 가린 항목은 재촬영을 안내한다. 등록된 체크칸과 서명란의 위치를 안내하고, 작성 후 재촬영해 체크 결과를 대조한다.</desc>
<rect width="2400" height="1500" fill="#FFFFFF"/>
<g font-family="'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<text x="100" y="79" font-size="25" font-weight="700" fill="#0968CF" text-anchor="start">DOC AGENT  /  SOFTWARE ARCHITECTURE</text>
<rect x="2043" y="48" width="257" height="47" rx="10" fill="#EAF3FE"/>
<text x="2171.5" y="80" font-size="23" font-weight="650" fill="#0968CF" text-anchor="middle">1주 시연 설계안</text>
<text x="100" y="164" font-size="62" font-weight="750" fill="#172231" text-anchor="start">노트북 문서 도우미 아키텍처</text>
<text x="100" y="222" font-size="29" font-weight="400" fill="#526174" text-anchor="start">비프음으로 문서 위치를 맞추고, 읽을 수 있는 내용을 원문 근거와 함께 안내합니다.</text>
